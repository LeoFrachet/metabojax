[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metabojax"
version = "0.1.0"
description = "Differentiable metabolic & pharmacological simulation environment in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.0",
    "diffrax>=0.6.0",
    "jaxtyping>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metabojax"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
